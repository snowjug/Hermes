[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytauto"
version = "0.1.0"
description = "Local YouTube upload pipeline: transcribe, write metadata with Claude Code, upload through YouTube Studio on a schedule."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.47",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
ytauto = "ytauto.cli:main"

[tool.setuptools.packages.find]
include = ["ytauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
